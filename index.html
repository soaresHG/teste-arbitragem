<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Treinamento de Tomada de Decisão - Arbitragem</title>
  <style>
    body {
      background-color: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    /* --- Fundo Animado com Elementos Grandes e Nítidos --- */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a2233 0%, #08090d 100%);
    }

    .floating-item {
      position: absolute;
      font-weight: 900;
      user-select: none;
      animation: floatAround linear infinite;
    }

    /* Estilos e Cores Nítidas por Classe */
    .item-yellow {
      color: #ffcc00;
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.6), 0 0 40px rgba(255, 204, 0, 0.3);
    }

    .item-red {
      color: #ff3333;
      text-shadow: 0 0 20px rgba(255, 51, 51, 0.6), 0 0 40px rgba(255, 51, 51, 0.3);
    }

    .item-white {
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    @keyframes floatAround {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.9);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      85% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(-20vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    .screen {
      display: none;
      width: 1200px;
      max-width: 98vw;
      background: rgba(22, 24, 30, 0.94);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.9), 0 0 20px rgba(255, 204, 0, 0.2);
      border: 1px solid rgba(255, 204, 0, 0.2);
      text-align: center;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .screen.active { display: block; }

    input[type="text"] {
      width: 80%;
      padding: 12px;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: white;
      margin-bottom: 20px;
      text-align: center;
    }

    .btn-start, .btn-restart {
      background: #ffcc00;
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-start:hover, .btn-restart:hover {
      transform: scale(1.05);
      background: #ffe066;
    }

    .game-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    video { 
      width: 100%; 
      max-height: 75vh;
      display: block; 
      object-fit: contain;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active { opacity: 1; pointer-events: auto; }

    .timer-circle {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #ff9800;
      color: #000;
      font-size: 40px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 152, 0, 0.9);
      animation: pulseTimer 1s infinite alternate;
    }

    @keyframes pulseTimer {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .options-container {
      display: flex;
      gap: 25px;
      width: 100%;
      justify-content: center;
      margin-bottom: 10px;
    }

    .btn-option {
      background: #333;
      color: white;
      border: 2px solid #ffcc00;
      padding: 18px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-option:hover {
      background: #ffcc00;
      color: #000;
      transform: scale(1.03);
    }

    .feedback-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 25px 40px;
      font-size: 32px;
      font-weight: bold;
      border-radius: 10px;
      text-transform: uppercase;
      display: none;
      z-index: 10;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      text-align: center;
      line-height: 1.4;
    }

    .feedback-correct { background-color: #2e7d32; color: white; }
    .feedback-wrong { background-color: #c62828; color: white; }

    .correct-answer-detail {
      font-size: 22px;
      display: block;
      margin-top: 8px;
      color: #ffeb3b;
      font-weight: normal;
      text-transform: none;
    }

    .saving-status { font-size: 14px; color: #aaa; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- ELEMENTOS FLUTUANTES GRANDES E NÍTIDOS -->
  <div class="bg-animation">
    <div class="floating-item item-yellow" style="left: 5%; font-size: 100px; animation-duration: 10s; animation-delay: 0s;">?</div>
    <div class="floating-item item-white"  style="left: 22%; font-size: 90px;  animation-duration: 14s; animation-delay: 2s;">⚽</div>
    <div class="floating-item item-red"    style="left: 38%; font-size: 110px; animation-duration: 12s; animation-delay: 4s;">?</div>
    <div class="floating-item item-yellow" style="left: 54%; font-size: 80px;  animation-duration: 16s; animation-delay: 1s;">🟨</div>
    <div class="floating-item item-yellow" style="left: 70%; font-size: 105px; animation-duration: 11s; animation-delay: 3s;">?</div>
    <div class="floating-item item-red"    style="left: 85%; font-size: 85px;  animation-duration: 13s; animation-delay: 5s;">🟥</div>
    <div class="floating-item item-white"  style="left: 15%; font-size: 75px;  animation-duration: 15s; animation-delay: 6s;">❓</div>
    <div class="floating-item item-yellow" style="left: 80%; font-size: 95px;  animation-duration: 12s; animation-delay: 7s;">?</div>
  </div>

  <!-- TELA 1: CADASTRO DO ÁRBITRO -->
  <div id="startScreen" class="screen active">
    <h2>Treinamento de Tomada de Decisão - Arbitragem</h2>
    <p>Digite o nome do árbitro para iniciar:</p>
    <input type="text" id="refereeName" placeholder="Nome Completo do Árbitro" required>
    <br>
    <button class="btn-start" onclick="iniciarTeste()">Iniciar Teste</button>
  </div>

  <!-- TELA 2: VÍDEO DO LANCE -->
  <div id="gameScreen" class="screen">
    <div class="header-info">
      <div>Árbitro: <span id="displayName" style="color: #ffcc00;"></span></div>
      <div>Pontuação: <span id="displayScore" style="color: #4CAF50;">0</span> pts</div>
    </div>

    <div class="game-container">
      <video id="player" controls playsinline webkit-playsinline>
        <source src="lance_arbitragem.mp4" type="video/mp4">
      </video>

      <!-- Camada de Decisão -->
      <div id="decisionOverlay" class="overlay">
        <div id="timer" class="timer-circle">5</div>
        <div class="options-container">
          <!-- A opção que passa 'true' é a considerada CORRETA -->
          <button class="btn-option" id="btnOptTrue" onclick="processarResposta(true)">Pênalti</button>
          <button class="btn-option" id="btnOptFalse" onclick="processarResposta(false)">Não Pênalti</button>
        </div>
      </div>

      <div id="feedback" class="feedback-banner"></div>
    </div>
  </div>

  <!-- TELA 3: FIM E ENVIO PARA O GOOGLE SHEETS -->
  <div id="endScreen" class="screen">
    <h2>Relatório do Teste</h2>
    <div>
      <p>Árbitro: <strong id="finalName"></strong></p>
      <p>Pontuação Final: <strong id="finalScore" style="color: #4CAF50;"></strong> pontos</p>
    </div>
    <p id="savingStatus" class="saving-status">Enviando resultado para a planilha...</p>
    <br>
    <button class="btn-restart" onclick="reiniciarTeste()">Novo Teste</button>
  </div>

  <script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzLpEZYsWf1yGnDp3JhXTUz2UvgiKgC5G54YWc-PDlxrJUOxHnLAd06ggvBrZHepAB4sg/exec";

    let nomeArbitro = "";
    let pontuacao = 0;
    const PONTOS_POR_ACERTO = 10;

    const SEGUNDO_DA_PAUSA = 3; 

    let tempoRestante = 5;
    let timerInterval = null;
    let decisaoTomada = false;

    const player = document.getElementById('player');
    const overlay = document.getElementById('decisionOverlay');
    const timerElement = document.getElementById('timer');
    const feedback = document.getElementById('feedback');

    // --- GERADOR DE ÁUDIO DO RELÓGIO REFORÇADO (Web Audio API) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTickSound(highPitch = false) {
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      const clickOsc = audioCtx.createOscillator();
      const clickGain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(highPitch ? 1200 : 900, now);

      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      clickOsc.type = 'square';
      clickOsc.frequency.setValueAtTime(highPitch ? 2500 : 2000, now);

      clickGain.gain.setValueAtTime(0.8, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      clickOsc.connect(clickGain);
      clickGain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);

      clickOsc.start(now);
      clickOsc.stop(now + 0.03);
    }

    function iniciarTeste() {
      initAudio();
      const nameInput = document.getElementById('refereeName').value;
      if (!nameInput.trim()) {
        alert("Por favor, digite o nome do árbitro!");
        return;
      }

      nomeArbitro = nameInput;
      pontuacao = 0;

      document.getElementById('displayName').innerText = nomeArbitro;
      document.getElementById('displayScore').innerText = pontuacao;

      document.getElementById('startScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
    }

    player.addEventListener('timeupdate', () => {
      if (Math.floor(player.currentTime) === SEGUNDO_DA_PAUSA && !decisaoTomada) {
        player.pause();
        iniciarFaseDecisao();
      }
    });

    player.addEventListener('ended', () => {
      finalizarEEnviar();
    });

    function iniciarFaseDecisao() {
      decisaoTomada = true;
      overlay.classList.add('active');
      tempoRestante = 5;
      timerElement.innerText = tempoRestante;

      playTickSound(true);

      timerInterval = setInterval(() => {
        tempoRestante--;
        timerElement.innerText = tempoRestante;

        if (tempoRestante > 0) {
          playTickSound(tempoRestante <= 2);
        } else {
          clearInterval(timerInterval);
          processarResposta(false);
        }
      }, 1000);
    }

    function processarResposta(isCorreta) {
      clearInterval(timerInterval);
      overlay.classList.remove('active');
      feedback.style.display = 'block';

      // Captura o texto do botão que contém a opção correta
      const textoOpcaoCorreta = document.getElementById('btnOptTrue').innerText;

      if (isCorreta) {
        pontuacao += PONTOS_POR_ACERTO;
        document.getElementById('displayScore').innerText = pontuacao;
        feedback.className = "feedback-banner feedback-correct";
        feedback.innerText = "Decisão Correta!";
      } else {
        feedback.className = "feedback-banner feedback-wrong";
        const motivo = tempoRestante <= 0 ? "Tempo Esgotado!" : "Decisão Incorreta!";
        
        // Exibe o motivo e aponta a resposta correta abaixo
        feedback.innerHTML = `${motivo}<span class="correct-answer-detail">Decisão Correta: <strong>${textoOpcaoCorreta}</strong></span>`;
      }

      // Mantém a mensagem visível por 2.5 segundos para leitura clara antes de continuar o vídeo
      setTimeout(() => {
        feedback.style.display = 'none';
        player.play();
      }, 2500);
    }

    function finalizarEEnviar() {
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('endScreen').classList.add('active');
      
      document.getElementById('finalName').innerText = nomeArbitro;
      document.getElementById('finalScore').innerText = pontuacao;

      if (URL_GOOGLE_SCRIPT !== "SUA_URL_DO_GOOGLE_SCRIPT_AQUI") {
        fetch(URL_GOOGLE_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome: nomeArbitro,
            pontos: pontuacao
          })
        })
        .then(() => {
          document.getElementById('savingStatus').innerText = "✓ Resultado registrado na planilha!";
          document.getElementById('savingStatus').style.color = "#4CAF50";
        })
        .catch(() => {
          document.getElementById('savingStatus').innerText = "Erro ao conectar com a planilha.";
          document.getElementById('savingStatus').style.color = "#f44336";
        });
      } else {
        document.getElementById('savingStatus').innerText = "Adicione a URL do Apps Script para salvar no Sheets.";
      }
    }

    function reiniciarTeste() {
      decisaoTomada = false;
      document.getElementById('refereeName').value = "";
      document.getElementById('savingStatus').innerText = "Enviando resultado para a planilha...";
      document.getElementById('savingStatus').style.color = "#aaa";
      document.getElementById('endScreen').classList.remove('active');
      document.getElementById('startScreen').classList.add('active');
    }
  </script>
</body>
</html>
